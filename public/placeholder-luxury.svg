<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="luxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="50%" stop-color="#0E0E10" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C799" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9A7B4F" />
    </linearGradient>
    <radialGradient id="luxGlow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#luxBg)" />
  <rect width="800" height="1000" fill="url(#luxGlow)" />

  <!-- Double Fine Luxury Borders -->
  <rect x="28" y="28" width="744" height="944" fill="none" stroke="#C5A880" stroke-opacity="0.25" stroke-width="1" />
  <rect x="36" y="36" width="728" height="928" fill="none" stroke="#C5A880" stroke-opacity="0.12" stroke-width="1" />

  <!-- Corner Flourishes -->
  <path d="M 28 48 L 48 48 L 48 28" fill="none" stroke="#C5A880" stroke-opacity="0.6" stroke-width="1.5" />
  <path d="M 772 48 L 752 48 L 752 28" fill="none" stroke="#C5A880" stroke-opacity="0.6" stroke-width="1.5" />
  <path d="M 28 952 L 48 952 L 48 972" fill="none" stroke="#C5A880" stroke-opacity="0.6" stroke-width="1.5" />
  <path d="M 772 952 L 752 952 L 752 972" fill="none" stroke="#C5A880" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Center Emblem Group -->
  <g transform="translate(400, 420)" text-anchor="middle">
    <!-- Outer Diamond / Circle Ornament -->
    <circle r="72" fill="none" stroke="#C5A880" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 3" />
    <circle r="60" fill="#18181B" fill-opacity="0.8" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- SF Monogram -->
    <text y="14" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="38" font-weight="600" fill="url(#goldGrad)" letter-spacing="4">SF</text>

    <!-- Brand Typography -->
    <text y="112" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#FAF8F5" letter-spacing="9">SENERIA</text>
    <text y="136" font-family="'Montserrat', sans-serif" font-size="11" font-weight="400" fill="#C5A880" letter-spacing="7">HAUTE COUTURE &amp; RUNWAY</text>

    <!-- Thin Divider Line -->
    <line x1="-80" y1="170" x2="80" y2="170" stroke="#C5A880" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="0" cy="170" r="3" fill="#C5A880" />

    <!-- Status / Curation Message in Arabic & English -->
    <text y="210" font-family="'Cairo', 'Amiri', Tahoma, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" letter-spacing="1">كولكشن البوتيك الحصري</text>
    <text y="234" font-family="'Montserrat', sans-serif" font-size="11" font-weight="300" fill="#A1A1AA" letter-spacing="3">EXCLUSIVE ATELIER PIECE</text>
    <text y="262" font-family="'Montserrat', sans-serif" font-size="9" font-weight="400" fill="#C5A880" letter-spacing="2">EST. 1992 • SULAIMANIYAH • ERBIL • BAGHDAD</text>
  </g>

  <!-- Bottom Brand Signature -->
  <text x="400" y="930" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="10" font-weight="400" fill="#52525B" letter-spacing="5">SENERIA FASHION HOUSE</text>
</svg>
